[project]
name = "chunkonomicon"
version = "0.1.0"
description = "Structure-aware RAG pipeline for language-learning textbooks."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
